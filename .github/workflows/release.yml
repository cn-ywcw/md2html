name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check compilation
        run: npm run build

      - name: Run tests
        run: node --test test/cli.test.mjs

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Package compiled tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          ls -lh release/*.tgz

      - name: Generate release notes
        env:
          RELEASE_REF: ${{ github.sha }}
          RELEASE_NOTES_PATH: release/release-notes.md
        run: node scripts/generate-release-notes.mjs

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "md2html-cli ${GITHUB_REF_NAME}" \
            --notes-file release/release-notes.md \
            release/*.tgz
